[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "telos-mcp"
version = "0.2.0.dev0"
description = "Model Context Protocol server for TELOS AI Labs governance (scoring, unsigned integrity-hash receipts, audit chain, CCRS replay)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "TELOS AI Labs", email = "team@telos-labs.ai" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "telos",
    "ai-governance",
    "agent-governance",
    "audit-chain",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # DRAFT (local 0.2.0.dev0): the telos-receipt that carries `telos_receipt.record`. The released range and
    # version are set at release.
    "telos-receipt[native]>=0.2.0.dev0,<0.3",
    "mcp>=1.30.0,<2",
    # Security floors for MCP's advisory-bearing runtime closure. MCP's own
    # lower bounds still admit the vulnerable versions recorded by TCAS r1.
    "anyio>=4.15.1",
    "idna>=3.20",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "starlette>=1.7.0",
    # Uvicorn and HTTPX still allow old h11/httpcore transitively. Constrain
    # that HTTP closure explicitly; floors on its consumers alone are insufficient.
    "uvicorn>=0.54.0",
    "httpx>=0.28.1",
    "httpcore>=1.0.9",
    "h11>=0.16.0",
]

[project.optional-dependencies]
# NOTE: no `engine` extra ships in v0.1. The live governance engine binds in
# v0.2 via a public, engine-agnostic call surface; until then the adapter fails
# closed and no engine dependency is pinned here.
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://telos-labs.ai"
Repository = "https://github.com/TELOS-Labs-AI/telos-mcp"
Issues = "https://github.com/TELOS-Labs-AI/telos-mcp/issues"
Documentation = "https://github.com/TELOS-Labs-AI/telos-mcp#readme"

[project.scripts]
telos-mcp = "telos_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["telos_mcp"]

[tool.hatch.build.targets.sdist]
only-include = ["telos_mcp", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md", "tests", "pyproject.toml", "server.json", "tools"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["mutants"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mutmut]
paths_to_mutate = [
    "telos_mcp/__init__.py",
    "telos_mcp/engine.py",
    "telos_mcp/engine_real.py",
    "telos_mcp/engine_stub.py",
    "telos_mcp/server.py",
]
also_copy = ["README.md"]

[tool.hatch.build]
artifacts = ["NOTICE"]
